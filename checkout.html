<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán - Hazel Shop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="icon" href="./images/s-hunt.png" type="image/png" />

    <style>
      :root {
        --hw-red: #e62117;
      }
      .product-img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 5px;
      }
      .summary-card {
        position: sticky;
        top: 90px;
      }
      .text-yellow {
        color: black !important;
        background-color: #ffcc00 !important;
      }
    </style>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold text-white" href="index.html"
          >HAZEL <span class="text-yellow">SHOP</span></a
        >
        <a href="index.html" class="btn btn-outline-light btn-sm"
          >Tiếp tục mua sắm</a
        >
      </div>
    </nav>

    <div class="container mb-5">
      <div class="row">
        <div class="col-lg-7">
          <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white fw-bold">
              Giỏ hàng của bạn (<span id="cartCount">0</span>)
            </div>
            <div class="card-body p-0" id="cartItems">
              <div class="text-center py-5">
                <p class="text-muted">Giỏ hàng trống.</p>
              </div>
            </div>
            <div class="card-footer bg-white text-end">
              <button
                class="btn btn-sm btn-outline-secondary"
                onclick="clearCart()"
              >
                Xóa tất cả
              </button>
            </div>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-header bg-white fw-bold">Thông tin giao hàng</div>
            <div class="card-body">
              <form id="checkoutForm">
                <div class="mb-3">
                  <label class="form-label small fw-bold">Họ và tên</label>
                  <input
                    type="text"
                    name="customer_name"
                    class="form-control"
                    required
                    placeholder="Nguyễn Văn A"
                  />
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label small fw-bold"
                      >Số điện thoại</label
                    >
                    <input
                      type="tel"
                      name="phone"
                      class="form-control"
                      required
                      placeholder="090xxxxxxx"
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label small fw-bold"
                      >Email (bắt buộc)</label
                    >
                    <input
                      type="email"
                      name="email"
                      class="form-control"
                      placeholder="vidu@gmail.com"
                      required
                    />
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold"
                    >Phương thức thanh toán</label
                  >
                  <div class="card p-3 bg-light border-0">
                    <div class="form-check mb-2">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="payment_method"
                        id="payFull"
                        value="Chuyển khoản Full"
                        checked
                        onchange="updatePaymentInfo()"
                      />
                      <label class="form-check-label small" for="payFull">
                        <strong>Chuyển khoản Full</strong><br />
                        Thanh toán 100% tiền hàng + ship.
                      </label>
                    </div>
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="payment_method"
                        id="payCOD"
                        value="COD"
                        onchange="updatePaymentInfo()"
                      />
                      <label class="form-check-label small" for="payCOD">
                        <strong>COD (Cọc trước 65k)</strong><br />
                        Gồm 50k cọc giữ hàng và 15k phí ship.
                      </label>
                    </div>
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold"
                    >Địa chỉ nhận hàng</label
                  >
                  <textarea
                    name="address"
                    class="form-control"
                    rows="2"
                    required
                    placeholder="Số nhà, tên đường, phường/xã..."
                  ></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold"
                    >Ghi chú đơn hàng</label
                  >
                  <textarea
                    name="note"
                    class="form-control"
                    rows="1"
                  ></textarea>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="card shadow-sm border-0 summary-card">
            <div class="card-body">
              <div id="qrArea" class="text-center mt-3 d-none">
                <div class="alert alert-warning small py-2 mb-2">
                  <i class="fa fa-info-circle"></i> Vui lòng quét mã QR để thanh
                  toán
                  <strong id="qrAmountLabel">0đ</strong>
                </div>
                <img
                  id="qrImage"
                  src=""
                  class="img-fluid border rounded shadow-sm"
                  style="max-width: 250px"
                />
              </div>
              <h5 class="fw-bold mb-4">Tổng cộng</h5>
              <div class="d-flex justify-content-between mb-2">
                <span>Tạm tính</span>
                <span id="subtotal">0đ</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span>Phí vận chuyển</span>
                <span class="text-success">+15.000đ</span>
              </div>
              <hr />
              <div class="d-flex justify-content-between mb-4">
                <span class="fw-bold fs-5">Thành tiền</span>
                <span class="fw-bold fs-5 text-danger" id="totalOrder">0đ</span>
              </div>
              <button
                type="button"
                onclick="submitOrder()"
                class="btn btn-danger w-100 py-3 fw-bold shadow"
              >
                XÁC NHẬN ĐẶT HÀNG
              </button>
              <p class="text-center text-muted small mt-3">
                Lưu ý: Shop có thể hủy đơn mà không cần báo trước nếu sản phẩm
                hết hàng!!
                <i class="fa fa-shield-alt"></i> Bảo mật thông tin khách hàng
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let allProducts = [];
      let cart = JSON.parse(localStorage.getItem("cart") || "[]");
      const shippingFee = 15000;
      let currentSubtotal = 0;

      /**
       * Khởi tạo dữ liệu khi trang web tải xong
       */
      async function init() {
        try {
          const response = await fetch(
            "https://web.kcnvietnam.com/it-asset/api/products.php",
          );
          allProducts = await response.json();
          renderCart();

          // Lắng nghe sự kiện thay đổi SĐT để cập nhật nội dung chuyển khoản trên QR
          document
            .querySelector('input[name="phone"]')
            .addEventListener("input", updatePaymentInfo);
        } catch (error) {
          console.error("Lỗi tải dữ liệu sản phẩm:", error);
        }
      }

      /**
       * Hiển thị danh sách giỏ hàng và tính toán tiền
       */
      function renderCart() {
        const container = document.getElementById("cartItems");
        const cartCount = document.getElementById("cartCount");
        const subtotalEl = document.getElementById("subtotal");
        const totalOrderEl = document.getElementById("totalOrder");

        if (cart.length === 0) {
          container.innerHTML = `
            <div class="text-center py-5">
                <p class="text-muted">Giỏ hàng trống.</p>
                <a href="index.html" class="btn btn-sm btn-danger">Mua sắm ngay</a>
            </div>`;
          cartCount.innerText = 0;
          subtotalEl.innerText = "0đ";
          totalOrderEl.innerText = "0đ";
          currentSubtotal = 0;
          updatePaymentInfo();
          return;
        }

        const counts = {};
        cart.forEach(id => (counts[id] = (counts[id] || 0) + 1));

        let subtotal = 0;
        let html = '<ul class="list-group list-group-flush">';

        for (const id in counts) {
          const product = allProducts.find(p => p.id == id);
          if (product) {
            const itemTotal = product.price * counts[id];
            subtotal += itemTotal;
            html += `
                <li class="list-group-item d-flex align-items-center py-3">
                    <img src="${product.img1}" class="product-img me-3">
                    <div class="flex-grow-1">
                        <h6 class="mb-0 small fw-bold">${product.name}</h6>
                        <small class="text-muted">${Number(product.price).toLocaleString()}đ x ${counts[id]}</small>
                    </div>
                    <div class="text-end">
                        <div class="fw-bold">${Number(itemTotal).toLocaleString()}đ</div>
                        <button class="btn btn-link btn-sm text-danger p-0" onclick="removeFromCart('${id}')">Xóa</button>
                    </div>
                </li>`;
          }
        }
        html += "</ul>";
        container.innerHTML = html;
        cartCount.innerText = cart.length;

        currentSubtotal = subtotal;
        subtotalEl.innerText = subtotal.toLocaleString() + "đ";
        totalOrderEl.innerText =
          (subtotal + shippingFee).toLocaleString() + "đ";

        // Cập nhật lại QR code dựa trên tổng tiền mới
        updatePaymentInfo();
      }

      /**
       * Xử lý thay đổi phương thức thanh toán và hiển thị QR VietQR
       */
      function updatePaymentInfo() {
        const paymentMethodEl = document.querySelector(
          'input[name="payment_method"]:checked',
        );
        if (!paymentMethodEl) return;

        const paymentMethod = paymentMethodEl.value;
        const qrArea = document.getElementById("qrArea");
        const qrImage = document.getElementById("qrImage");
        const qrAmountLabel = document.getElementById("qrAmountLabel");
        const qrNote = document.getElementById("qrNote");

        // Lấy SĐT khách hàng để làm nội dung chuyển khoản
        const phoneInput =
          document.querySelector('input[name="phone"]').value.trim() || "SDT";
        const totalAmount = currentSubtotal + shippingFee;

        let amountToPay = 0;
        if (paymentMethod === "Chuyển khoản Full") {
          amountToPay = totalAmount;
        } else if (paymentMethod === "COD") {
          amountToPay = 65000; // 50k cọc + 15k ship
        }

        if (amountToPay > 0 && currentSubtotal > 0) {
          qrArea.classList.remove("d-none");
          qrAmountLabel.innerText = amountToPay.toLocaleString() + "đ";
          // Tạo link VietQR động
          // VCB: Vietcombank, HUNG3979: Số tài khoản
          const qrUrl = `https://img.vietqr.io/image/VCB-HUNG3979-compact2.png?amount=${amountToPay}&accountName=Hazel%20Shop`;
          qrImage.src = qrUrl;
        } else {
          qrArea.classList.add("d-none");
        }
      }

      /**
       * Xóa 1 sản phẩm khỏi giỏ hàng
       */
      function removeFromCart(id) {
        cart = cart.filter(itemId => itemId != id);
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      /**
       * Xóa toàn bộ giỏ hàng
       */
      function clearCart() {
        if (confirm("Bạn muốn xóa toàn bộ giỏ hàng?")) {
          localStorage.removeItem("cart");
          cart = [];
          renderCart();
        }
      }

      /**
       * Xử lý gửi đơn hàng lên Server
       */
      async function submitOrder() {
        const form = document.getElementById("checkoutForm");

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        if (cart.length === 0) {
          alert("Giỏ hàng đang trống!");
          return;
        }

        try {
          // BƯỚC 1: Kiểm tra tồn kho và giá thực tế qua API
          const counts = {};
          cart.forEach(id => {
            counts[id] = (counts[id] || 0) + 1;
          });

          const itemsToCheck = Object.keys(counts).map(id => ({
            id: id,
            qty: counts[id],
          }));

          const checkRes = await fetch(
            "https://web.kcnvietnam.com/it-asset/api/check_cart.php",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ items: itemsToCheck }),
            },
          );

          const checkData = await checkRes.json();

          if (!checkData.ok) {
            alert("⚠️ " + checkData.message);
            return;
          }

          // BƯỚC 2: Gom dữ liệu khách hàng và đơn hàng
          const formData = new FormData(form);
          const customerInfo = Object.fromEntries(formData.entries());

          const orderData = {
            customer: customerInfo,
            items: cart, // Danh sách SKU
            subtotal: checkData.subtotal,
            shipping_fee: shippingFee,
            total: checkData.grandTotal,
            payment_method: customerInfo.payment_method,
            status: "Pending",
            created_at: new Date().toLocaleString("vi-VN"),
          };

          // BƯỚC 3: Lưu đơn hàng vào database/file JSON
          const saveRes = await fetch(
            "https://web.kcnvietnam.com/it-asset/api/save_order.php",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(orderData),
            },
          );

          if (saveRes.ok) {
            alert("🎉 Chúc mừng! Đơn hàng của bạn đã được tiếp nhận.");
            localStorage.removeItem("cart");
            window.location.href = "index.html";
          } else {
            alert("❌ Lỗi khi lưu đơn hàng. Vui lòng thử lại sau.");
          }
        } catch (err) {
          console.error(err);
          alert("❌ Lỗi kết nối máy chủ! Vui lòng kiểm tra mạng.");
        }
      }

      // Chạy khởi tạo khi load trang
      init();
    </script>
  </body>
</html>
